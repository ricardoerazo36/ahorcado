<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Ahorcado</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ahorcado.css">
</head>
<body>

<main class="game">
  <div class="top">
    <h1>El Ahorcado</h1>
    <div class="dots" id="dots" aria-label="Intentos restantes"></div>
  </div>

  <svg class="gallows" id="svg" viewBox="40 60 280 345" aria-label="Horca"></svg>

  <div class="word" id="word"></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="keys" id="keys"></div>

  <button class="btn" id="reset">NUEVA PARTIDA</button>
  <div class="result" id="result" aria-hidden="true"></div>
</main>

<script src="ahorcado.js"></script>
</body>
</html>
