<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Ahorcado</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f6f2; --paper-2:#efeee8;
    --ink:#141412; --ink-soft:#3d3d38; --ink-mute:#8a8a82;
    --hair:rgba(20,20,18,.14); --hair-strong:rgba(20,20,18,.32);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px 16px;
    background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;
  }
  .game{
    position:relative;width:100%;max-width:820px;padding:32px 36px 28px;
    border:1px solid var(--hair);
    background:linear-gradient(175deg,#fbfaf7 0%,var(--paper-2) 100%);
  }
  .game::after{content:"";position:absolute;inset:8px;border:1px solid var(--hair);pointer-events:none}

  .top{display:flex;justify-content:space-between;align-items:center}
  h1{font-family:'Fraunces',serif;font-weight:300;font-size:30px;letter-spacing:.02em}
  .dots{display:flex;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink);transition:all .3s ease}
  .dot.off{background:transparent;border:1px solid var(--ink-mute);transform:scale(.8)}

  svg.gallows{width:100%;max-width:340px;height:auto;display:block;margin:6px auto 0}
  .stroke-part{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
  .faint{stroke:var(--hair-strong);stroke-width:1;fill:none}
  .draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .65s cubic-bezier(.25,.8,.25,1) both}
  @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .pendulum{transform-origin:250px 78px;animation:sway 3.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(2.2deg)}50%{transform:rotate(-2.2deg)}}
  .shake{animation:shk .25s ease 2}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  .word{display:flex;flex-wrap:nowrap;gap:10px;justify-content:center;margin:22px 0 14px;container-type:inline-size}
  .slot{
    flex:0 1 46px;min-width:0;height:52px;border-bottom:2px solid var(--ink);
    font-family:'Fraunces',serif;text-align:center;line-height:48px;
    font-size:clamp(14px,calc(100cqw / var(--n,8) * .7),38px);
  }
  .slot.new{animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both}
  .slot.miss{border-bottom-color:var(--ink-mute);color:var(--ink-mute)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .word.win .slot{animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .msg{min-height:20px;text-align:center;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:14px}

  .keys{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:22px}
  .key{
    width:36px;height:36px;border:1px solid var(--hair-strong);border-radius:50%;
    background:none;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;
    transition:background .2s,color .2s;
  }
  .key:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  .key:disabled{cursor:default}
  .key.ok{background:rgba(20,20,18,.09)}
  .key.bad{color:var(--ink-mute);text-decoration:line-through}
  .key:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .btn{
    display:block;margin:0 auto;padding:10px 22px;font:inherit;font-size:12px;letter-spacing:.14em;
    background:none;border:1px solid var(--ink);color:var(--ink);cursor:pointer;transition:all .25s ease;
  }
  .btn:hover{background:var(--ink);color:var(--paper)}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="game">
  <div class="top">
    <h1>El Ahorcado</h1>
    <div class="dots" id="dots" aria-label="Intentos restantes"></div>
  </div>

  <svg class="gallows" id="svg" viewBox="40 60 280 345" aria-label="Horca"></svg>

  <div class="word" id="word"></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="keys" id="keys"></div>

  <button class="btn" id="reset">NUEVA PARTIDA</button>
</main>

<script>
/* ================= LÓGICA (de ahorcado.ts) ================= */
const palabras = ["programa","teclado","ventana","internet","variable","computador","arreglo","funcion", "lampara", "pampara", "salsa", "salsero", "regueton"];
const INTENTOS_INICIALES = 6;
let palabraSecreta = "";
let letrasUsadas = [];
let intentos = INTENTOS_INICIALES;

function elegirPalabra(){ return palabras[Math.floor(Math.random()*palabras.length)]; }
function haGanado(){ return [...palabraSecreta].every(l => letrasUsadas.includes(l)); }
function haPerdido(){ return intentos <= 0; }

function ingresarLetra(entrada){
  if(haGanado() || haPerdido()) return "El juego ya terminó.";
  const letra = entrada.toLowerCase();
  if(letra.length !== 1 || letra < "a" || letra > "z") return "Ingresa solo una letra válida.";
  if(letrasUsadas.includes(letra)) return `Ya usaste la "${letra}".`;
  letrasUsadas.push(letra);
  if(palabraSecreta.includes(letra)){
    return haGanado() ? "¡Ganaste!" : "¡Correcto!";
  }
  intentos--;
  return haPerdido() ? `Perdiste. La palabra era: ${palabraSecreta}` : `Incorrecto. Te quedan ${intentos}.`;
}

function reiniciarJuego(){
  palabraSecreta = elegirPalabra();
  letrasUsadas = [];
  intentos = INTENTOS_INICIALES;
}

/* ================= HORCA ================= */
const PARTES = [
  {d:'M62 388 Q180 383 298 388', w:5},      // base
  {d:'M92 386 Q88 200 91 76', w:5},          // columna
  {d:'M91 78 Q170 73 252 78', w:5},          // voladizo
  {d:'M250 78 Q249 100 250 122', w:4.5},     // cuerda
  {c:[250,149,24], w:4.5},                   // cabeza
  {d:'M250 173 Q251 215 250 258', w:4.5},    // torso
  {d:'M250 192 Q232 208 216 226', w:4.5},    // brazo izq
  {d:'M250 192 Q268 208 284 226', w:4.5},    // brazo der
  {d:'M250 258 Q236 282 222 306', w:4.5},    // pierna izq
  {d:'M250 258 Q264 282 278 306', w:4.5},    // pierna der
];
// errores (0..6) -> cuántas piezas se dibujan
const PIEZAS_POR_ERROR = [0, 3, 5, 6, 8, 9, 10];
const INK = '#141412';

function ojos(n){
  if(n < 5) return '';
  const x = 250, y = 149;
  if(n < 10) return `<circle cx="${x-8}" cy="${y-3}" r="2.4" fill="${INK}"/><circle cx="${x+8}" cy="${y-3}" r="2.4" fill="${INK}"/>`;
  return `<path d="M${x-11} ${y-7} L${x-5} ${y+1} M${x-5} ${y-7} L${x-11} ${y+1} M${x+5} ${y-7} L${x+11} ${y+1} M${x+11} ${y-7} L${x+5} ${y+1}" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" fill="none"/>`;
}

let piezasMostradas = 0;
function dibujarHorca(n){
  const nueva = i => i >= piezasMostradas ? ' draw' : '';
  let fijo = `<line x1="40" y1="392" x2="320" y2="392" class="faint"/>`;
  let colgado = '';
  PARTES.slice(0, n).forEach((p, i) => {
    const el = p.c
      ? `<circle class="stroke-part${nueva(i)}" pathLength="1" cx="${p.c[0]}" cy="${p.c[1]}" r="${p.c[2]}" stroke-width="${p.w}"/>`
      : `<path class="stroke-part${nueva(i)}" pathLength="1" d="${p.d}" stroke-width="${p.w}"/>`;
    if(i >= 3) colgado += el; else fijo += el;
  });
  if(n >= 4) colgado += `<circle cx="250" cy="124" r="3" fill="${INK}"/>` + ojos(n);
  svg.innerHTML = fijo + (colgado ? `<g class="pendulum">${colgado}</g>` : '');
  piezasMostradas = n;
}

/* ================= INTERFAZ ================= */
const svg = document.getElementById('svg');
const wordEl = document.getElementById('word');
const keysEl = document.getElementById('keys');
const msgEl = document.getElementById('msg');
const dotsEl = document.getElementById('dots');
let ultima = '';

function construirTeclas(){
  keysEl.innerHTML = '';
  for(const l of 'abcdefghijklmnopqrstuvwxyz'){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'key'; b.id = 'key-' + l;
    b.textContent = l.toUpperCase();
    b.onclick = () => jugar(l);
    keysEl.appendChild(b);
  }
}

function actualizar(fallo){
  // horca
  dibujarHorca(PIEZAS_POR_ERROR[INTENTOS_INICIALES - intentos]);
  if(fallo){ svg.classList.remove('shake'); void svg.getBoundingClientRect(); svg.classList.add('shake'); }
  // intentos
  dotsEl.innerHTML = '';
  for(let i = 0; i < INTENTOS_INICIALES; i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < intentos ? '' : ' off');
    dotsEl.appendChild(d);
  }
  // palabra
  wordEl.innerHTML = '';
  wordEl.style.setProperty('--n', palabraSecreta.length);
  wordEl.classList.toggle('win', haGanado());
  for(const l of palabraSecreta){
    const s = document.createElement('div');
    s.className = 'slot';
    if(letrasUsadas.includes(l)){
      s.textContent = l.toUpperCase();
      if(l === ultima) s.classList.add('new');
    } else if(haPerdido()){
      s.textContent = l.toUpperCase();
      s.classList.add('miss');
    } else s.innerHTML = '&nbsp;';
    wordEl.appendChild(s);
  }
  // teclas
  for(const b of keysEl.children){
    const l = b.id.slice(4), usada = letrasUsadas.includes(l);
    b.disabled = usada || haGanado() || haPerdido();
    if(usada) b.classList.add(palabraSecreta.includes(l) ? 'ok' : 'bad');
  }
}

function jugar(entrada){
  const antes = letrasUsadas.length, intentosAntes = intentos;
  msgEl.textContent = ingresarLetra(entrada);
  ultima = letrasUsadas.length > antes ? entrada.toLowerCase() : '';
  actualizar(intentos < intentosAntes);
}

function nuevaPartida(){
  reiniciarJuego();
  ultima = ''; piezasMostradas = 0;
  msgEl.textContent = 'Elige una letra.';
  construirTeclas();
  actualizar(false);
}

document.getElementById('reset').onclick = nuevaPartida;
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^[a-zA-Z]$/.test(e.key)) jugar(e.key);
});
nuevaPartida();
</script>
</body>
</html>
